<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kegiatan</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library html2pdf.js untuk export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Mengunci ukuran kertas A4 agar tidak terpotong di HP/iPhone */
        .pdf-canvas {
            width: 794px !important;
            max-width: 794px !important;
            min-width: 794px !important;
            background-color: #ffffff;
            padding: 30px;
            box-sizing: border-box;
            margin: 0 auto;
        }
        
        /* Memastikan teks berpindah baris secara rapi */
        .cell-text {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-3 text-slate-800">

    <div class="max-w-4xl mx-auto mb-4 bg-white p-4 rounded-xl shadow-sm flex justify-between items-center flex-wrap gap-2">
        <h1 class="text-xl font-bold text-slate-700">Aplikasi Laporan Kegiatan</h1>
        <div class="flex gap-2">
            <button onclick="addRow()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Tambah Baris
            </button>
            <button onclick="exportToPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v3.586l-1.293-1.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V8z" clip-rule="evenodd" />
                </svg>
                Simpan PDF
            </button>
        </div>
    </div>

    <!-- Area Dokumen yang Akan Dikonversi ke PDF -->
    <div class="overflow-x-auto pb-6">
        <div id="reportArea" class="pdf-canvas shadow-md border border-slate-200 rounded-sm">
            
            <!-- Header Dokumen -->
            <div class="text-center mb-6 pb-4 border-b-2 border-slate-300">
                <h2 class="text-2xl font-black uppercase tracking-wide text-slate-800">KEGIATAN</h2>
                <p class="text-sm text-slate-500 mt-1">Dokumentasi dan Laporan Pelaksanaan Kegiatan</p>
            </div>

            <!-- Tabel Utama -->
            <table class="w-full border-collapse border border-slate-300 text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-700 uppercase text-xs tracking-wider">
                        <th class="border border-slate-300 p-3 w-12 text-center">NO</th>
                        <th class="border border-slate-300 p-3 w-64 text-center">DOKUMENTASI</th>
                        <th class="border border-slate-300 p-3 text-center">KETERANGAN</th>
                        <th class="border border-slate-300 p-3 w-16 text-center no-print">AKSI</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Baris akan ditambahkan secara dinamis lewat JS -->
                </tbody>
            </table>

            <!-- Footer Dokumen -->
            <div class="mt-8 pt-4 border-t border-slate-200 text-right text-xs text-slate-400">
                <p id="printDate"></p>
            </div>
        </div>
    </div>

    <script>
        let rowCount = 0;

        // Tambah baris baru saat pertama kali dimuat
        window.onload = function() {
            addRow();
            addRow();
            setPrintDate();
        };

        function setPrintDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('printDate').innerText = 'Dicetak pada: ' + now.toLocaleDateString('id-ID', options);
        }

        function addRow() {
            rowCount++;
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.className = "row-item border-b border-slate-300";
            tr.id = `row-${rowCount}`;

            tr.innerHTML = `
                <td class="border border-slate-300 p-3 text-center font-bold text-slate-700 row-number">
                    ${tbody.children.length + 1}
                </td>
                <td class="border border-slate-300 p-3 align-top">
                    <div class="flex flex-col items-center gap-2">
                        <div id="preview-container-${rowCount}" class="hidden w-full flex justify-center">
                            <img id="preview-${rowCount}" class="max-h-48 rounded shadow-sm object-contain border border-slate-200" src="" alt="Dokumentasi">
                        </div>
                        <label class="no-print cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs py-1.5 px-3 rounded border border-slate-300 transition text-center w-full">
                            <span>📷 Pilih / Ambil Foto</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${rowCount})">
                        </label>
                    </div>
                </td>
                <td class="border border-slate-300 p-3 align-top">
                    <textarea class="w-full h-28 p-2 border border-slate-200 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y text-slate-700 text-sm cell-text" placeholder="Isikan keterangan kegiatan secara bebas di sini..."></textarea>
                </td>
                <td class="border border-slate-300 p-3 text-center align-middle no-print">
                    <button onclick="deleteRow(${rowCount})" class="text-red-500 hover:text-red-700 p-1 rounded" title="Hapus Baris">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
            updateNumbers();
        }

        function deleteRow(id) {
            const row = document.getElementById(`row-${id}`);
            if (row) {
                row.remove();
                updateNumbers();
            }
        }

        function updateNumbers() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, index) => {
                const numberCell = row.querySelector('.row-number');
                if (numberCell) {
                    numberCell.innerText = index + 1;
                }
            });
        }

        function handleImageUpload(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById(`preview-${id}`);
                    const container = document.getElementById(`preview-container-${id}`);
                    preview.src = e.target.result;
                    container.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function exportToPDF() {
            setPrintDate();
            
            // Sembunyikan tombol & input yang tidak perlu masuk ke PDF
            const noPrintElements = document.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');

            // Konversi textarea menjadi div teks agar hasil cetak jernih & teratur
            const textareas = document.querySelectorAll('textarea');
            const createdDivs = [];
            textareas.forEach(ta => {
                const div = document.createElement('div');
                div.className = 'p-1 text-slate-700 text-sm cell-text min-h-[80px]';
                div.innerText = ta.value;
                ta.style.display = 'none';
                ta.parentNode.appendChild(div);
                createdDivs.push({ ta, div });
            });

            const element = document.getElementById('reportArea');
            
            // Opsi optimasi PDF khusus iPhone / iOS
            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     'Laporan_Kegiatan.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    scrollX: 0, 
                    scrollY: 0,
                    windowWidth: 1024 
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Proses pembuatan PDF
            html2pdf().set(opt).from(element).save().then(() => {
                // Kembalikan tampilan semula setelah PDF diunduh
                noPrintElements.forEach(el => el.style.display = '');
                createdDivs.forEach(item => {
                    item.ta.style.display = '';
                    item.div.remove();
                });
            });
        }
    </script>
</body>
</html>
