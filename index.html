<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kegiatan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library html2canvas untuk Konversi ke Gambar JPG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .cell-text {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* Mengunci ukuran area cetak agar rapi saat dikonversi ke JPG */
        .jpg-export-mode {
            width: 800px !important;
            max-width: 800px !important;
            min-width: 800px !important;
            margin: 0 auto !important;
            background-color: #ffffff !important;
            padding: 30px !important;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-3 text-slate-800">

    <!-- Header Panel Tombol -->
    <div class="max-w-4xl mx-auto mb-4 bg-white p-4 rounded-xl shadow-sm flex justify-between items-center flex-wrap gap-2 no-print">
        <h1 class="text-xl font-bold text-slate-700">Aplikasi Laporan Kegiatan</h1>
        <div class="flex gap-2">
            <button onclick="addRow()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-1 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Tambah Baris
            </button>
            <button onclick="exportToJPG()" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-1 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
                </svg>
                Simpan JPG
            </button>
        </div>
    </div>

    <!-- Area Dokumen Utama -->
    <div class="max-w-4xl mx-auto overflow-x-auto pb-6">
        <div id="reportArea" class="bg-white p-6 shadow-md border border-slate-200 rounded-sm">
            
            <!-- Header Dokumen -->
            <div class="text-center mb-6 pb-4 border-b-2 border-slate-300">
                <h2 class="text-2xl font-black uppercase tracking-wide text-slate-800">KEGIATAN</h2>
                <p class="text-sm text-slate-500 mt-1">Dokumentasi dan Laporan Pelaksanaan Kegiatan</p>
            </div>

            <!-- Tabel Utama -->
            <table class="w-full border-collapse border border-slate-300 text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-700 uppercase text-xs tracking-wider">
                        <th class="border border-slate-300 p-2 w-[8%] text-center">NO</th>
                        <th class="border border-slate-300 p-2 w-[55%] text-center">DOKUMENTASI</th>
                        <th class="border border-slate-300 p-2 w-[30%] text-center">KETERANGAN</th>
                        <th class="border border-slate-300 p-2 w-[7%] text-center no-print">AKSI</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Baris ditambahkan dinamis -->
                </tbody>
            </table>

            <!-- Footer Tanggal -->
            <div class="mt-8 pt-4 border-t border-slate-200 text-right text-xs text-slate-400">
                <p id="printDate"></p>
            </div>
        </div>
    </div>

    <script>
        let rowCount = 0;

        window.onload = function() {
            addRow();
            addRow();
            setPrintDate();
        };

        function setPrintDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('printDate').innerText = 'Dicetak pada: ' + now.toLocaleDateString('id-ID', options);
        }

        function addRow() {
            rowCount++;
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.className = "row-item border-b border-slate-300";
            tr.id = `row-${rowCount}`;

            tr.innerHTML = `
                <td class="border border-slate-300 p-2 text-center font-bold text-slate-700 row-number align-top">
                    ${tbody.children.length + 1}
                </td>
                <td class="border border-slate-300 p-2 align-top">
                    <div class="flex flex-col items-center gap-2">
                        <div id="preview-container-${rowCount}" class="hidden w-full flex justify-center">
                            <img id="preview-${rowCount}" class="max-h-72 w-full rounded shadow-sm object-contain border border-slate-200" src="" alt="Dokumentasi">
                        </div>
                        <label class="no-print cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs py-1.5 px-3 rounded border border-slate-300 transition text-center w-full">
                            <span>📷 Pilih / Ambil Foto</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${rowCount})">
                        </label>
                    </div>
                </td>
                <td class="border border-slate-300 p-2 align-top">
                    <textarea class="w-full h-32 p-2 border border-slate-200 rounded focus:ring-1 focus:ring-blue-500 outline-none resize-y text-slate-700 text-sm cell-text" placeholder="Isikan keterangan kegiatan..."></textarea>
                </td>
                <td class="border border-slate-300 p-2 text-center align-middle no-print">
                    <button onclick="deleteRow(${rowCount})" class="text-red-500 hover:text-red-700 p-1 rounded" title="Hapus">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
            updateNumbers();
        }

        function deleteRow(id) {
            const row = document.getElementById(`row-${id}`);
            if (row) {
                row.remove();
                updateNumbers();
            }
        }

        function updateNumbers() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, index) => {
                const numberCell = row.querySelector('.row-number');
                if (numberCell) {
                    numberCell.innerText = index + 1;
                }
            });
        }

        function handleImageUpload(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById(`preview-${id}`);
                    const container = document.getElementById(`preview-container-${id}`);
                    preview.src = e.target.result;
                    container.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function exportToJPG() {
            setPrintDate();
            const element = document.getElementById('reportArea');

            // 1. Sembunyikan tombol & kolom aksi
            const noPrintElements = document.querySelectorAll('.no-print');
            noPrintElements.forEach(el => el.style.display = 'none');

            // 2. Ubah textarea menjadi elemen div biasa
            const textareas = document.querySelectorAll('textarea');
            const createdDivs = [];
            textareas.forEach(ta => {
                const div = document.createElement('div');
                div.className = 'p-1 text-slate-700 text-sm cell-text w-full';
                div.innerText = ta.value || '-';
                ta.style.display = 'none';
                ta.parentNode.appendChild(div);
                createdDivs.push({ ta, div });
            });

            element.classList.add('jpg-export-mode');

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff',
                windowWidth: 800
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Laporan_Kegiatan.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();

                element.classList.remove('jpg-export-mode');
                noPrintElements.forEach(el => el.style.display = '');
                createdDivs.forEach(item => {
                    item.ta.style.display = '';
                    item.div.remove();
                });
            });
        }
    </script>
</body>
</html>
