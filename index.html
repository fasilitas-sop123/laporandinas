<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kegiatan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Container tersembunyi khusus untuk render PDF */
        #pdfRenderArea {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 794px; /* Standar Lebar Pixel A4 */
            background-color: #ffffff;
            padding: 40px;
            box-sizing: border-box;
        }

        .cell-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-3 text-slate-800">

    <!-- Header Panel Tombol -->
    <div class="max-w-4xl mx-auto mb-4 bg-white p-4 rounded-xl shadow-sm flex justify-between items-center flex-wrap gap-2">
        <h1 class="text-xl font-bold text-slate-700">Aplikasi Laporan Kegiatan</h1>
        <div class="flex gap-2">
            <button onclick="addRow()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Tambah Baris
            </button>
            <button onclick="exportToPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm5 6a1 1 0 10-2 0v3.586l-1.293-1.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V8z" clip-rule="evenodd" />
                </svg>
                Simpan PDF
            </button>
        </div>
    </div>

    <!-- Tampilan Aplikasi Utama (Untuk Input di Layar HP/PC) -->
    <div class="max-w-4xl mx-auto bg-white p-6 shadow-md border border-slate-200 rounded-sm">
        <div class="text-center mb-6 pb-4 border-b-2 border-slate-300">
            <h2 class="text-2xl font-black uppercase tracking-wide text-slate-800">KEGIATAN</h2>
            <p class="text-sm text-slate-500 mt-1">Dokumentasi dan Laporan Pelaksanaan Kegiatan</p>
        </div>

        <table class="w-full border-collapse border border-slate-300 text-sm">
            <thead>
                <tr class="bg-slate-100 text-slate-700 uppercase text-xs tracking-wider">
                    <th class="border border-slate-300 p-2 w-10 text-center">NO</th>
                    <th class="border border-slate-300 p-2 w-1/3 text-center">DOKUMENTASI</th>
                    <th class="border border-slate-300 p-2 text-center">KETERANGAN</th>
                    <th class="border border-slate-300 p-2 w-12 text-center">AKSI</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Baris Input Dinamis -->
            </tbody>
        </table>

        <div class="mt-8 pt-4 border-t border-slate-200 text-right text-xs text-slate-400">
            <p id="printDate"></p>
        </div>
    </div>

    <!-- Area Khusus Rendering PDF (Di Luar Layar) -->
    <div id="pdfRenderArea">
        <div class="text-center mb-6 pb-4 border-b-2 border-slate-300">
            <h2 class="text-2xl font-black uppercase tracking-wide text-slate-800">KEGIATAN</h2>
            <p class="text-sm text-slate-500 mt-1">Dokumentasi dan Laporan Pelaksanaan Kegiatan</p>
        </div>

        <table class="w-full border-collapse border border-slate-300 text-sm">
            <thead>
                <tr class="bg-slate-100 text-slate-700 uppercase text-xs tracking-wider">
                    <th class="border border-slate-300 p-2 w-12 text-center">NO</th>
                    <th class="border border-slate-300 p-2 w-64 text-center">DOKUMENTASI</th>
                    <th class="border border-slate-300 p-2 text-center">KETERANGAN</th>
                </tr>
            </thead>
            <tbody id="pdfTableBody">
                <!-- Data disalin ke sini saat export -->
            </tbody>
        </table>

        <div class="mt-8 pt-4 border-t border-slate-200 text-right text-xs text-slate-400">
            <p id="pdfPrintDate"></p>
        </div>
    </div>

    <script>
        let rowCount = 0;

        window.onload = function() {
            addRow();
            addRow();
            setPrintDate();
        };

        function setPrintDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            const dateStr = 'Dicetak pada: ' + now.toLocaleDateString('id-ID', options);
            document.getElementById('printDate').innerText = dateStr;
            document.getElementById('pdfPrintDate').innerText = dateStr;
        }

        function addRow() {
            rowCount++;
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.className = "row-item border-b border-slate-300";
            tr.id = `row-${rowCount}`;

            tr.innerHTML = `
                <td class="border border-slate-300 p-2 text-center font-bold text-slate-700 row-number">
                    ${tbody.children.length + 1}
                </td>
                <td class="border border-slate-300 p-2 align-top">
                    <div class="flex flex-col items-center gap-2">
                        <div id="preview-container-${rowCount}" class="hidden w-full flex justify-center">
                            <img id="preview-${rowCount}" class="max-h-48 rounded shadow-sm object-contain border border-slate-200" src="" alt="Dokumentasi">
                        </div>
                        <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs py-1.5 px-3 rounded border border-slate-300 transition text-center w-full">
                            <span>📷 Pilih / Ambil Foto</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${rowCount})">
                        </label>
                    </div>
                </td>
                <td class="border border-slate-300 p-2 align-top">
                    <textarea id="text-${rowCount}" class="w-full h-28 p-2 border border-slate-200 rounded focus:ring-1 focus:ring-blue-500 outline-none resize-y text-slate-700 text-sm cell-text" placeholder="Isikan keterangan kegiatan..."></textarea>
                </td>
                <td class="border border-slate-300 p-2 text-center align-middle">
                    <button onclick="deleteRow(${rowCount})" class="text-red-500 hover:text-red-700 p-1 rounded" title="Hapus">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
            updateNumbers();
        }

        function deleteRow(id) {
            const row = document.getElementById(`row-${id}`);
            if (row) {
                row.remove();
                updateNumbers();
            }
        }

        function updateNumbers() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach((row, index) => {
                const numberCell = row.querySelector('.row-number');
                if (numberCell) {
                    numberCell.innerText = index + 1;
                }
            });
        }

        function handleImageUpload(event, id) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById(`preview-${id}`);
                    const container = document.getElementById(`preview-container-${id}`);
                    preview.src = e.target.result;
                    container.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function exportToPDF() {
            setPrintDate();
            
            const pdfTbody = document.getElementById('pdfTableBody');
            pdfTbody.innerHTML = ''; // Kosongkan data lama

            const inputRows = document.querySelectorAll('#tableBody tr');

            inputRows.forEach((row, index) => {
                const id = row.id.replace('row-', '');
                const imgSrc = document.getElementById(`preview-${id}`).src;
                const isImgVisible = !document.getElementById(`preview-container-${id}`).classList.contains('hidden');
                const textVal = document.getElementById(`text-${id}`).value;

                const pdfTr = document.createElement('tr');
                pdfTr.className = "border-b border-slate-300";

                pdfTr.innerHTML = `
                    <td class="border border-slate-300 p-3 text-center font-bold text-slate-700 align-top">
                        ${index + 1}
                    </td>
                    <td class="border border-slate-300 p-3 align-top text-center">
                        ${isImgVisible ? `<img src="${imgSrc}" class="max-h-48 rounded mx-auto border border-slate-200">` : '<span class="text-slate-400 text-xs italic">(Tidak ada foto)</span>'}
                    </td>
                    <td class="border border-slate-300 p-3 align-top text-slate-700 cell-text">
                        ${textVal ? textVal : '-'}
                    </td>
                `;

                pdfTbody.appendChild(pdfTr);
            });

            // Ekspor elemen khusus PDF yang sudah terisolasi
            const element = document.getElementById('pdfRenderArea');
            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     'Laporan_Kegiatan.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, windowWidth: 800 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
